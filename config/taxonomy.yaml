# Research Taxonomy Configuration for Google Photos Vague-Memory Retrieval (V1)
version: "1.0"
description: "Research taxonomy for Google Photos vague-memory retrieval (V1)"

relevance_criteria:
  - "User is searching for visual media (photo, video, screenshot, scan, document)"
  - "User exhibits vague, partial, or imprecise memory of the item or its context"
  - "User describes search failure, friction, breakdown, or manual workarounds"

relevance_classes:
  - id: "relevant"
    description: "Direct vague-memory retrieval failure or friction with recalled episodic fragments"
  - id: "possibly_relevant"
    description: "Retrieval issue implied, ambiguous, or combined with broader album organization complaints"
  - id: "irrelevant"
    description: "App crashes, sync/backup errors, subscription/billing, or non-retrieval complaints"

memory_cues:
  categories:
    - id: "person"
      description: "People, faces, or groups depicted in the photo"
    - id: "place_location"
      description: "Geographic places, landmarks, rooms, cities, venues, or travel spots (e.g. 'Goa', 'beach', 'café')"
    - id: "event_occasion"
      description: "Weddings, trips, birthdays, parties, holidays, concerts, graduations"
    - id: "temporal_epoch"
      description: "Approximate year, season, life stage (e.g. 'during college', 'sometime in 2022', 'before moving')"
    - id: "object"
      description: "Physical items, cars, clothes, pets, food, devices, medicine"
    - id: "visual_details"
      description: "Colors, lighting, framing, composition, blurriness (e.g. 'red shirt', 'sunset', 'night lighting')"
    - id: "text_in_image"
      description: "Memes, screenshots of text, receipts, documents, medicine names, restaurant signs"
    - id: "activity_action"
      description: "Sports, dancing, eating, travelling, studying, attending an event"
    - id: "relationship"
      description: "Social and interpersonal ties (e.g. 'my friend', 'my mother', 'old roommate')"
    - id: "ambient_context"
      description: "Weather, mood, emotional state, background atmosphere, companionship"

retrieval_failure_stages:
  categories:
    - id: "memory_to_query"
      description: "Memory → Query: User remembers photo details but cannot convert memory into searchable terms"
    - id: "query_to_system"
      description: "Query → System: User provides reasonable natural description but system misinterprets intent"
    - id: "system_to_candidate"
      description: "System → Candidate: System returns too many, too few, or completely unrelated candidates"
    - id: "candidate_to_recognition"
      description: "Candidate → Recognition: User struggles to distinguish the target item among candidates in gallery"
    - id: "search_refinement"
      description: "Search Refinement: Initial search fails and user lacks cues/controls to iteratively steer search"

retrieval_failure_points:
  categories:
    - id: "vocabulary_mismatch"
      description: "User search query does not match AI or metadata labels in gallery"
    - id: "temporal_fuzziness"
      description: "User cannot recall exact date/month; timeline scrolling fails"
    - id: "missing_metadata"
      description: "No geotag, EXIF stripped, or device migration lost timestamps"
    - id: "visual_semantic_gap"
      description: "Concept is abstract or compositional (e.g., 'me looking silly', 'sunset vibe')"
    - id: "screenshot_clutter"
      description: "Target item drowned in thousands of untagged screenshots and memes"
    - id: "volume_overload"
      description: "Gallery too large (10k+ photos) to browse manually without fatigue"

target_media_types:
  - "personal_photo"
  - "screenshot"
  - "video_clip"
  - "document_receipt"
  - "meme_saved_image"
  - "scanned_physical_photo"

workaround_types:
  categories:
    - id: "endless_scrolling"
      description: "Brute-force scrolling through timeline for hours"
    - id: "external_social_backup"
      description: "Searching Facebook, Instagram, Google Drive, or WhatsApp chat logs for sent copy"
    - id: "peer_inquiry"
      description: "Asking friends/family if they have a copy of the photo"
    - id: "reverse_image_search"
      description: "Using Google Lens or TinEye if a similar image is available"
    - id: "keyword_guessing"
      description: "Repeatedly typing adjacent keywords hoping the search system hits"
    - id: "abandonment"
      description: "Giving up and assuming the memory is lost forever"

friction_types:
  - "time_wasted"
  - "frustration_with_search_tool"
  - "fear_of_memory_loss"
  - "cognitive_overload"
  - "device_storage_anxiety"

groq_analysis:
  model: "llama-3.3-70b-versatile"
  temperature: 0.1
  max_retries: 3
  timeout_seconds: 30
  batch_size: 1
